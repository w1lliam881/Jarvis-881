# Tester vid varje ändring: körs när något pushas eller en PR öppnas eller uppdateras.
# Gratis i GitHub (ingår i GitHubs fria minuter). Om något misslyckas syns ett rött kryss på PR:en.
name: Tester

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tester-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tester:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typkontroll
        run: npm run typecheck
      - name: Enhetstester
        run: npm test
      - name: Bygge
        run: npm run build
      - name: Webbläsare för end-to-end
        run: npx playwright install --with-deps chromium
      - name: End-to-end
        run: npm run e2e
